<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console Nuittea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#0F2A3D;--blue:#1F7AB8;--ink:#13212C;--mute:#5E6E7A;--line:#E3E8EC;--bg:#F5F7F9;--card:#fff;--green:#1E8E5A;--red:#C0392B;--amber:#C27C0E}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px;font-weight:600;color:var(--ink)}
button.p{background:var(--blue);border-color:var(--blue);color:#fff}button.d{color:var(--red);border-color:#f0c9c4}button.s{padding:4px 9px;font-size:12px}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
label.f{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
a{color:var(--blue)}
#app{display:flex;min-height:100vh}
nav{width:230px;background:var(--navy);color:#cfe0ec;padding:18px 12px 90px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{color:#fff;font-weight:800;font-size:18px;padding:0 8px 14px}nav .brand small{display:block;font-weight:500;font-size:12px;color:#8fb0c6}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f9fb5;padding:12px 10px 4px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#cfe0ec;padding:8px 10px;margin:1px 0}
nav button.on{background:rgba(255,255,255,.12);color:#fff}nav .b{background:#C0392B;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
nav .me{position:fixed;bottom:0;left:0;width:230px;padding:12px 20px;font-size:12px;color:#8fb0c6;background:var(--navy);border-top:1px solid rgba(255,255,255,.08)}
main{flex:1;padding:24px;min-width:0;max-width:1260px}
h1{font-size:22px;margin:0 0 16px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:22px;font-weight:800}.kpi .l{color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--mute)}.sm{font-size:12px}.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.g{background:#E3F4EB;color:var(--green)}.pill.r{background:#FBE6E3;color:var(--red)}.pill.a{background:#FCF1DE;color:var(--amber)}.pill.n{background:#EEF2F5;color:var(--mute)}.pill.b{background:#E4F0F9;color:var(--blue)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.num{text-align:right;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.room{border:1px solid var(--line);border-radius:10px;padding:10px}.room.h{background:#FBF3F2}
.room img{width:100%;height:90px;object-fit:cover;border-radius:6px;background:#eef}
.kan{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto}
.kan .col{background:#EEF2F5;border-radius:10px;padding:8px;min-height:120px}.kan .col h4{margin:2px 4px 8px;font-size:13px}
.kan .it{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;max-width:85%;white-space:pre-wrap}.msg.h{background:#EEF2F5}.msg.s{background:#E4F0F9;margin-left:auto}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:20;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(15,42,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:10;overflow:auto}
.modal>.card{width:100%;max-width:480px}.modal>.card.w{max-width:860px}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:6px}.perms label{display:flex;gap:6px;align-items:center}.perms input,.chk{width:auto}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs2 button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#mbar,#mtop{display:none}
@media(max-width:820px){
  #app{display:block}
  nav{display:none;position:fixed;top:52px;left:0;right:0;bottom:64px;width:auto;height:auto;z-index:15;padding:12px 12px 90px}
  body.navopen nav{display:block}
  nav .me{position:static;width:auto;border:0;padding:12px 10px}
  #mtop{display:flex;position:sticky;top:0;z-index:16;height:52px;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:0 14px}
  #mtop a{color:#fff;font-weight:600;text-decoration:none;font-size:14px}
  #mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:16;height:64px;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #mbar button{border:0;border-radius:0;background:none;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;position:relative}
  #mbar button.on{color:var(--blue)} #mbar svg{width:22px;height:22px} #mbar .b{position:absolute;top:6px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  main{padding:14px 12px 84px}
  h1{font-size:20px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .modal{padding:0;align-items:stretch}.modal>.card,.modal>.card.w{max-width:none;min-height:100%;border-radius:0;margin:0}
  .kan{grid-template-columns:repeat(6,82vw)}
  td,th{padding:7px 6px}
}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>Console Nuittea</h1>
    <p class="muted">Réservée à l'équipe Nuittea.</p>
    <form id="lf"><input id="le" type="email" placeholder="Adresse e-mail" required autocomplete="username" style="margin-bottom:8px"><input id="lp" type="password" placeholder="Mot de passe" required autocomplete="current-password" style="margin-bottom:10px"><button class="p" style="width:100%">Se connecter</button></form>
    <button id="lg" style="width:100%;margin-top:8px">Continuer avec Google</button>
    <div id="mfa" hidden style="margin-top:12px"><label class="f">Code de validation (application d'authentification)</label><input id="mc" inputmode="numeric" maxlength="6"><button class="p" id="mv" style="width:100%;margin-top:8px">Valider</button></div>
    <p id="lerr" class="muted" style="color:var(--red)"></p>
  </div>
</div>
<div id="app" hidden><div id="mtop"><strong>Console Nuittea</strong><a href="./?hotel=1">Mon hôtel →</a></div><nav id="nav"></nav><main id="main"></main><div id="mbar"></div></div>
<div id="toast"></div>
<script>
const SB_URL = 'https://kuuyhtvdnoqyikrcbpot.supabase.co';
const sb = supabase.createClient(SB_URL, 'sb_publishable_0AT6IoJyfnTlANz0Lf-erg_Sj85F1yT');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n == null ? '—' : Math.round(Number(n)).toLocaleString('fr-FR').replace(/\s/g, ' ') + ' F';
const dfr = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const dtfr = d => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const days = d => d ? Math.round((new Date(d) - new Date()) / 864e5) : null;
const ago = d => { if (!d) return 'jamais'; const n = Math.floor((Date.now() - new Date(d)) / 864e5); return n <= 0 ? "aujourd'hui" : n === 1 ? 'hier' : `il y a ${n} j`; };
const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.style.background = bad ? 'var(--red)' : 'var(--navy)'; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3800); };
const SITE = 'https://nuittea.pages.dev';
const ROLES = { direction: 'Direction', commercial: 'Commercial', support: 'Support', finance: 'Finance', lecture: 'Lecture' };
const PERMS = { dashboard: 'Aperçu', crm: 'CRM', clients: 'Clients', support: 'Support', finance: 'Finances', moderation: 'Modération', moderation_delete: 'Retrait de publication', demo: 'Comptes de démonstration', impersonate: 'Vue client', team: 'Équipe', settings: 'Réglages', journal: 'Journal' };
const BASE = { direction: Object.keys(PERMS), commercial: ['dashboard','crm','clients','demo'], support: ['dashboard','clients','support','moderation','demo'], finance: ['dashboard','clients','finance','journal'], lecture: ['dashboard','clients'] };
const ACTIONS = { chambre_masquee: 'Chambre masquée', chambre_reaffichee: 'Chambre réaffichée', etablissement_suspendu: 'Établissement suspendu', etablissement_retabli: 'Établissement rétabli', publication_retiree: 'Publication retirée', equipe_modifiee: 'Équipe modifiée', fiche_valide: 'Fiche validée', fiche_refuse: 'Fiche refusée', fiche_a_verifier: 'Fiche remise à vérifier', avis_publie: 'Avis publié', avis_masque: 'Avis masqué', signalement_traite: 'Signalement traité', signalement_rejete: 'Signalement rejeté', ticket_modifie: 'Demande d\'assistance modifiée', annonce_enregistree: 'Annonce enregistrée', commission_encaissee: 'Commission encaissée', vue_client: 'Vue client consultée', reglage_modifie: 'Réglage modifié', demo_reinitialisee: 'Démonstration réinitialisée', demo_connexion: 'Connexion démonstration', reversement_payee: 'Reversement versé', reversement_refusee: 'Reversement refusé', reversement_en_cours: 'Reversement en cours', formule_modifiee: 'Formule modifiée', abonnement_prolonge: 'Accès prolongé', paiement_enregistre: 'Paiement enregistré', compte_suspendu: 'Compte suspendu', compte_reactive: 'Compte réactivé', abonnement_resilie: 'Abonnement résilié', derogations_modifiees: 'Fonctions ou limites modifiées', commission_modifiee: 'Commission modifiée', employe_reactive: 'Employé réactivé', employe_desactive: 'Employé désactivé', compte_marque_test: 'Marqué compte de test', compte_marque_reel: 'Marqué compte réel' };
const STATUS = { pending: 'En attente', confirmed: 'Confirmée', checked_in: 'En séjour', checked_out: 'Partie', cancelled: 'Annulée', no_show: 'Absente' };
const SUB = { active: ['Actif', 'g'], trial: ['Essai', 'b'], past_due: ['Impayé', 'r'], suspended: ['Suspendu', 'r'], cancelled: ['Résilié', 'n'], expired: ['Expiré', 'r'] };
const STAGES = { a_contacter: 'À contacter', contacte: 'Contacté', demo: 'Démo faite', essai: 'En essai', abonne: 'Abonné', perdu: 'Perdu' };
const T_STATUS = { ouvert: ['Ouverte', 'r'], en_cours: ['En cours', 'a'], attente_client: ['Attente client', 'b'], resolu: ['Résolue', 'g'], ferme: ['Fermée', 'n'] };
const T_PRIO = { basse: 'Basse', normale: 'Normale', haute: 'Haute', urgente: 'Urgente' };
const T_CAT = { question: 'Question', probleme: 'Problème', facturation: 'Facturation', nuittea: 'Nuittea.com', suggestion: 'Suggestion' };
const REASONS = { photos: 'Photos trompeuses', prix: 'Prix incorrect', injoignable: 'Hôtel injoignable', adresse: 'Adresse erronée', comportement: 'Comportement', autre: 'Autre' };
const NOTE_K = { note: 'Note', appel: 'Appel', whatsapp: 'WhatsApp', email: 'E-mail', visite: 'Visite', demo: 'Démonstration' };
const DEMO_R = { owner: 'Propriétaire', manager: 'Gérant', receptionist: 'Réceptionniste', housekeeping: 'Agent de ménage', accountant: 'Comptable', staff: 'Employé' };
let D = null, V = 'apercu', Q = '', SUBV = {};
const can = p => D && D.me.perms.includes(p);
const wa = (n, t) => n ? 'https://wa.me/' + String(n).replace(/[^0-9]/g, '') + (t ? '?text=' + encodeURIComponent(t) : '') : null;
const staffName = id => { const s = (D.staff || []).find(x => x.user_id === id); return s ? (s.name || s.email) : ''; };
const health = o => { const d = o.last_login ? (Date.now() - new Date(o.last_login)) / 864e5 : 999; if (d <= 3 && o.resas_30 >= 3) return ['g', 'Actif']; if (d <= 10) return ['a', 'À surveiller']; return ['r', 'Inactif']; };
const rpc = async (fn, args, ok) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast(error.message, true); return null; } if (ok) toast(ok); return data ?? true; };

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.replace('./'); return; }
  const { data, error } = await sb.rpc('admin_console_data');
  if (error) {
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.nextLevel === 'aal2' && aal.currentLevel === 'aal1') return showLogin(true);
    showLogin(); $('lerr').innerHTML = 'Ce compte (' + esc(session.user.email) + ') n\'a pas accès à la console. <a href="#" id="lo">Changer de compte</a>';
    $('lo').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.replace('./'); }; return;
  }
  D = data; D.email = session.user.email; $('login').hidden = true; $('app').hidden = false; render();
}
function showLogin(mfa){ $('login').hidden = false; $('app').hidden = true; $('mfa').hidden = !mfa; $('lf').hidden = !!mfa; $('lg').hidden = !!mfa; }
async function reload(){ const { data, error } = await sb.rpc('admin_console_data'); if (error) return toast(error.message, true); const e = D.email; D = data; D.email = e; render(); }

function alerts(){
  const A = [], o = D.orgs || [];
  D.ests.filter(e => e.listed && e.review === 'a_verifier').forEach(e => A.push(['a', `Fiche à vérifier : ${e.name}`, 'publications']));
  (D.reports || []).filter(r => r.status === 'nouveau').forEach(r => A.push(['r', `Signalement : ${r.est} — ${REASONS[r.reason]}`, 'signalements']));
  (D.tickets || []).filter(t => t.status === 'ouvert' && ['haute', 'urgente'].includes(t.priority)).forEach(t => A.push(['r', `Demande ${T_PRIO[t.priority].toLowerCase()} : ${t.org} — ${t.subject}`, 'support']));
  o.filter(x => !x.is_test && x.status === 'trial' && days(x.end) !== null && days(x.end) <= 2).forEach(x => A.push(['a', `Essai qui se termine ${days(x.end) <= 0 ? 'aujourd\'hui' : 'dans ' + days(x.end) + ' j'} : ${x.name}`, 'revenus']));
  o.filter(x => !x.is_test && x.status === 'active' && days(x.end) !== null && days(x.end) <= 7).forEach(x => A.push(['a', `Abonnement à échéance le ${dfr(x.end)} : ${x.name}`, 'revenus']));
  o.filter(x => !x.is_test && ['past_due', 'expired', 'suspended'].includes(x.status)).forEach(x => A.push(['r', `Abonnement ${SUB[x.status][0].toLowerCase()} : ${x.name}`, 'revenus']));
  o.filter(x => !x.is_test && x.commission && x.commission.overdue > 0).forEach(x => A.push(['a', `Commission en retard : ${x.name} (${money(x.commission.overdue)})`, 'commissions']));
  o.filter(x => !x.is_test && ['active', 'trial'].includes(x.status) && health(x)[0] === 'r').forEach(x => A.push(['r', `Client inactif (dernière connexion ${ago(x.last_login)}) : ${x.name}`, 'clients']));
  D.ests.filter(e => e.cancel_rate >= 40).forEach(e => A.push(['a', `Annulations élevées sur Nuittea (${e.cancel_rate} %) : ${e.name}`, 'publications']));
  (D.tasks || []).filter(t => !t.done && t.assignee === D.me.id && t.due && days(t.due) <= 0).forEach(t => A.push(['b', `Tâche du jour : ${t.title}`, 'taches']));
  return A;
}

function render(){
  const nb = { publications: D.stats.to_review, signalements: D.stats.reports, support: (D.tickets || []).filter(t => t.status === 'ouvert').length, taches: (D.tasks || []).filter(t => !t.done && t.assignee === D.me.id && t.due && days(t.due) <= 0).length };
  const G = [
    ['Pilotage', [['apercu', 'Aperçu', 'dashboard'], ['revenus', 'Abonnements', 'clients'], ['clients', 'Clients', 'clients'], ['commissions', 'Commissions', 'finance'], ['reversements', 'Reversements', 'finance']]],
    ['Nuittea.com', [['publications', 'Publications', 'dashboard'], ['avis', 'Avis clients', 'moderation'], ['signalements', 'Signalements', 'moderation']]],
    ['Relation client', [['crm', 'Prospects', 'crm'], ['taches', 'Tâches', 'dashboard'], ['support', 'Assistance', 'support'], ['annonces', 'Annonces', 'support'], ['demo', 'Démonstration', 'demo']]],
    ['Administration', [['equipe', 'Équipe', 'team'], ['journal', 'Journal', 'journal'], ['reglages', 'Réglages', 'dashboard']]]];
  const all = G.flatMap(g => g[1]).filter(t => can(t[2]));
  if (!all.find(t => t[0] === V)) V = all[0][0];
  $('nav').innerHTML = `<div class="brand">Nuittea<small>Console d'administration</small></div>` + G.map(([g, ts]) => { const v = ts.filter(t => can(t[2])); return v.length ? `<div class="grp">${g}</div>` + v.map(t => `<button data-v="${t[0]}" class="${V === t[0] ? 'on' : ''}"><span>${t[1]}</span>${nb[t[0]] ? `<span class="b">${nb[t[0]]}</span>` : ''}</button>`).join('') : ''; }).join('') +
    `<div class="me"><a href="./?hotel=1" style="display:block;color:#fff;font-weight:600;margin-bottom:6px;text-decoration:none">← Mon hôtel (Nuittea Manager)</a>${esc(D.email)}<br>${esc(ROLES[D.me.role] || '')} · <a href="#" id="rf" style="color:#cfe0ec">Actualiser</a> · <a href="#" id="out" style="color:#cfe0ec">Déconnexion</a></div>`;
  const IC = { apercu: '<path d="M3 12l9-8 9 8M5 10v10h14V10"/>', clients: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M21 20c0-2-1-4-4-5"/>', publications: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>', support: '<path d="M4 5h16v11H8l-4 4z"/>', plus: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>' };
  const MB = [['apercu', 'Aperçu', 'dashboard'], ['clients', 'Clients', 'clients'], ['publications', 'Publications', 'dashboard'], ['support', 'Assistance', 'support']].filter(t => can(t[2])).slice(0, 4);
  $('mbar').innerHTML = MB.map(([k, l]) => `<button type="button" data-mv="${k}" class="${V === k ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}${nb[k] ? `<span class="b">${nb[k]}</span>` : ''}</button>`).join('') + `<button type="button" id="mmore" class="${MB.some(t => t[0] === V) ? '' : 'on'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC.plus}</svg>Plus</button>`;
  $('mbar').style.gridTemplateColumns = `repeat(${MB.length + 1},1fr)`;
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { V = b.dataset.mv; Q = ''; document.body.classList.remove('navopen'); render(); window.scrollTo(0, 0); });
  $('mmore').onclick = () => document.body.classList.toggle('navopen');
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { V = b.dataset.v; Q = ''; document.body.classList.remove('navopen'); render(); window.scrollTo(0, 0); });
  $('out').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.replace('./'); };
  $('rf').onclick = e => { e.preventDefault(); reload(); };
  ({ reversements: vPayouts, apercu: vApercu, revenus: vRevenus, clients: vClients, commissions: vCom, publications: vPub, avis: vAvis, signalements: vRep, crm: vCrm, taches: vTasks, support: vSupport, annonces: vAnn, demo: vDemo, equipe: vTeam, journal: vJournal, reglages: vSettings })[V]();
}
function bindGo(){ document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { V = b.dataset.go; render(); }); }

function modal(html, wide){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card ${wide ? 'w' : ''}">${html}</div>`; document.body.appendChild(m); m.onclick = e => { if (e.target === m) m.remove(); }; m.querySelectorAll('[data-x]').forEach(b => b.onclick = () => m.remove()); return m; }
function ask(title, ph, cb, opt){
  const m = modal(`<h3>${esc(title)}</h3><textarea rows="3" placeholder="${esc(ph)}"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button data-x>Annuler</button><button class="p" data-ok>Confirmer</button></div>`);
  const t = m.querySelector('textarea'); t.focus();

/* ---------- Publications ---------- */
function checks(e){ const P = []; if (!e.photos && !e.cover && !e.rooms.some(r => r.photos)) P.push('Aucune photo'); if (!e.has_description) P.push('Description absente ou trop courte'); if (e.rooms.some(r => r.active && !r.hidden && (!r.rate || r.rate < 3000))) P.push('Prix nul ou suspect'); if (!e.phone && !e.whatsapp) P.push('Aucun contact'); return P; }
function vPub(){
  const f = SUBV.pub || 'tous', F = { tous: () => true, verifier: e => e.listed && e.review === 'a_verifier', refuse: e => e.review === 'refuse', suspendu: e => !!e.suspended_at, problemes: e => checks(e).length > 0 };
  const list = D.ests.filter(F[f]).filter(e => !Q || (e.name + ' ' + (e.city || '') + ' ' + (e.org || '')).toLowerCase().includes(Q.toLowerCase()));

    list.map(e => {
      const st = e.suspended_at ? '<span class="pill r">Suspendu</span>' : e.listed ? '<span class="pill g">Publié</span>' : '<span class="pill n">Non publié</span>', rv = REV[e.review] || ['—', 'n'], P = checks(e);
      return `<div class="card"><div class="row between"><div><h3>${esc(e.name)} ${st} <span class="pill ${rv[1]}">Fiche ${rv[0].toLowerCase()}</span> ${e.is_test ? '<span class="pill a">Test</span>' : ''}</h3><div class="muted">${esc(e.city || '')} · ${esc(e.org)} · commission ${e.commission ?? '—'} %${e.cancel_rate != null ? ' · annulations ' + e.cancel_rate + ' %' : ''}</div>
          ${P.length ? `<div style="margin-top:4px">${P.map(p => `<span class="pill a">${p}</span>`).join(' ')}</div>` : ''}
          ${e.review === 'refuse' && e.review_note ? `<div class="sm" style="color:var(--red);margin-top:4px">Motif du refus : ${esc(e.review_note)}</div>` : ''}
          ${e.suspended_at ? `<div style="color:var(--red);margin-top:4px">Suspendu le ${dtfr(e.suspended_at)} : ${esc(e.suspended_reason)}</div>` : ''}</div>
        <div class="row">${e.slug ? `<a href="${SITE}/hotel/${esc(e.slug)}" target="_blank" rel="noopener"><button>Voir la fiche</button></a>` : ''}
          ${wa(e.whatsapp || e.phone) ? `<a href="${wa(e.whatsapp || e.phone)}" target="_blank" rel="noopener"><button>WhatsApp hôtel</button></a>` : ''}
          ${e.phone ? `<a href="tel:${esc(e.phone)}"><button>Appeler</button></a>` : ''}${e.email ? `<a href="mailto:${esc(e.email)}"><button>E-mail</button></a>` : ''}
          ${mod && e.review !== 'valide' ? `<button class="p" data-ok="${e.id}">Valider la fiche</button>` : ''}${mod && e.review !== 'refuse' ? `<button class="d" data-ko="${e.id}">Refuser</button>` : ''}
          ${mod ? (e.suspended_at ? `<button data-unsus="${e.id}">Rétablir</button>` : `<button class="d" data-sus="${e.id}">Suspendre</button>`) : ''}
          ${can('moderation_delete') && e.listed ? `<button class="d" data-rm="${e.id}">Retirer la publication</button>` : ''}</div></div>
        <details style="margin-top:10px"><summary>${e.rooms.length} chambre(s)${e.rooms.some(r => r.hidden) ? ' · ' + e.rooms.filter(r => r.hidden).length + ' masquée(s)' : ''}</summary><div class="rooms">${e.rooms.map(r => `<div class="room ${r.hidden ? 'h' : ''}">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy">` : ''}<div class="row between" style="margin-top:6px"><strong>Ch. ${esc(r.number)}</strong>${r.hidden ? '<span class="pill a">Masquée</span>' : r.active ? '' : '<span class="pill n">Inactive</span>'}</div><div class="muted">${esc(r.type || 'Chambre')} · ${money(r.rate)} · ${r.photos} photo(s)</div>${r.hidden ? `<div class="muted sm">${esc(r.reason)}</div>` : ''}${mod ? `<button style="margin-top:6px;width:100%" data-room="${r.id}" data-h="${r.hidden ? 0 : 1}">${r.hidden ? 'Réafficher' : 'Masquer sur Nuittea'}</button>` : ''}</div>`).join('')}</div></details>

    : act('admin_room_hide', { p_room: b.dataset.room, p_hidden: false, p_reason: null }, 'Chambre réaffichée.'));
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => act('admin_listing_review', { p_est: b.dataset.ok, p_status: 'valide', p_note: null }, 'Fiche validée.'));
  document.querySelectorAll('[data-ko]').forEach(b => b.onclick = () => ask('Refuser la fiche', 'Ce que l\'hôtel doit corriger (photos, prix, description…)', r => act('admin_listing_review', { p_est: b.dataset.ko, p_status: 'refuse', p_note: r }, 'Fiche refusée : elle n\'apparaît plus sur Nuittea.')));
  document.querySelectorAll('[data-sus]').forEach(b => b.onclick = () => ask('Suspendre l\'établissement sur Nuittea', 'Motif communiqué à l\'hôtel', r => act('admin_est_suspend', { p_est: b.dataset.sus, p_suspend: true, p_reason: r }, 'Établissement suspendu.')));

}

/* ---------- Journal ---------- */
function vJournal(){
  const tgt = j => { if (j.type === 'establishment') { const e = D.ests.find(x => x.id === j.id); return e ? e.name : 'Établissement'; } if (j.type === 'room') { for (const e of D.ests) { const r = e.rooms.find(x => x.id === j.id); if (r) return e.name + ' · Ch. ' + r.number; } return 'Chambre'; } if (j.type === 'organization') { const o = (D.orgs || []).find(x => x.id === j.id); return o ? o.name : 'Client'; } if (j.type === 'staff') return j.detail.email || 'Équipe'; if (j.type === 'demo') return 'Démonstration · ' + (DEMO_R[j.id] || 'tous'); return j.type || ''; };
  const det = j => j.detail.motif || (j.detail.role ? ROLES[j.detail.role] : '') || (j.detail.montant ? money(j.detail.montant) : '') || (j.detail.jours ? j.detail.jours + ' jour(s)' : '') || (j.detail.apres && j.detail.apres.plan ? j.detail.apres.plan : '') || (j.detail.employe || '') || j.detail.titre || j.detail.valeur || '';
  $('main').innerHTML = `<div class="row between"><h1>Journal</h1><input id="jq" placeholder="Filtrer" style="max-width:240px"></div><div class="card tw"><table id="jt"></table></div>`;
  const draw = () => { const f = $('jq').value.toLowerCase(); const rows = (D.journal || []).filter(j => !f || JSON.stringify(j).toLowerCase().includes(f) || (ACTIONS[j.action] || '').toLowerCase().includes(f) || tgt(j).toLowerCase().includes(f));
    $('jt').innerHTML = '<tr><th>Date</th><th>Par</th><th>Action</th><th>Cible</th><th>Motif / détail</th></tr>' + (rows.length ? rows.map(j => `<tr><td style="white-space:nowrap">${dtfr(j.at)}</td><td>${esc(j.actor || '—')}</td><td>${esc(ACTIONS[j.action] || j.action)}</td><td>${esc(tgt(j))}</td><td>${esc(det(j))}</td></tr>`).join('') : '<tr><td colspan="5" class="muted">Aucune action enregistrée.</td></tr>'); };
  $('jq').oninput = draw; draw();
}

/* ---------- Réglages et sécurité ---------- */
async function vSettings(){
  const { data: f } = await sb.auth.mfa.listFactors(); const tot = (f && f.totp || []).filter(x => x.status === 'verified');
  const st = can('settings');
  const { data: meRow } = await sb.from('platform_staff').select('alert_instant,alert_weekly').eq('user_id', D.me.id).maybeSingle(); const me = meRow || { alert_instant: true, alert_weekly: true };
  $('main').innerHTML = `<h1>Réglages et sécurité</h1>
    <div class="card"><h3>Ma validation en deux étapes</h3><p class="muted">Protège votre compte : en plus du mot de passe, un code à 6 chiffres de votre application d'authentification (Google Authenticator, Microsoft Authenticator…).</p>
      ${tot.length ? `<p><span class="pill g">Activée</span> ${D.me.aal === 'aal2' ? '' : '<span class="pill a">Session actuelle sans code</span>'}</p><button class="d" id="mfx">Désactiver sur mon compte</button>` : '<button class="p" id="mfe">Activer la validation en deux étapes</button>'}<div id="mfz"></div></div>
    ${st ? `<div class="card"><h3>Règles de la plateforme</h3>
      <label class="row" style="flex-wrap:nowrap;align-items:flex-start;margin-bottom:12px"><input type="checkbox" class="chk" id="rr" ${D.settings.review_required ? 'checked' : ''} style="margin-top:3px"><span><strong>Validation obligatoire des nouvelles fiches</strong><br><span class="muted sm">Une fiche publiée par un hôtel n'apparaît sur Nuittea.com qu'après validation par l'équipe. Les fiches déjà validées restent en ligne.</span></span></label>
      <label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" class="chk" id="mr" ${D.settings.mfa_required ? 'checked' : ''} style="margin-top:3px"><span><strong>Validation en deux étapes obligatoire pour l'équipe</strong><br><span class="muted sm">Sans code, un membre de l'équipe n'accède plus à la console. Activez-la d'abord sur votre compte et vérifiez que chaque membre l'a activée.</span></span></label></div>` : ''}
    <div class="card"><h3>Mes alertes par e-mail</h3><p class="muted" style="margin-top:0">Vous ne recevez que les alertes correspondant à vos accès.</p>
      <label class="row" style="margin-bottom:8px"><input type="checkbox" class="chk" id="ai" ${me.alert_instant ? 'checked' : ''}> Alertes immédiates (demande urgente, signalement, fiche à vérifier, paiement en échec)</label>
      <label class="row"><input type="checkbox" class="chk" id="aw" ${me.alert_weekly ? 'checked' : ''}> Point hebdomadaire (lundi 7 h)</label>
      <div class="row" style="margin-top:10px"><button id="atest">M'envoyer un e-mail de test</button></div></div>`;
  if ($('mfe')) $('mfe').onclick = async () => {
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Console Nuittea ' + Date.now() }); if (error) return toast(error.message, true);
    $('mfz').innerHTML = `<p style="margin-top:12px">1. Scannez ce code avec votre application d'authentification :</p><img src="${data.totp.qr_code}" alt="Code QR" style="width:180px;height:180px;background:#fff"><p class="muted sm">Ou saisissez la clé : <code>${esc(data.totp.secret)}</code></p><p>2. Saisissez le code affiché :</p><div class="row" style="flex-wrap:nowrap;max-width:320px"><input id="mfc" inputmode="numeric" maxlength="6"><button class="p" id="mfv">Valider</button></div>`;
    $('mfv').onclick = async () => { const { data: ch, error: e1 } = await sb.auth.mfa.challenge({ factorId: data.id }); if (e1) return toast(e1.message, true);
      const { error: e2 } = await sb.auth.mfa.verify({ factorId: data.id, challengeId: ch.id, code: $('mfc').value.trim() }); if (e2) return toast('Code incorrect.', true);
      toast('Validation en deux étapes activée.'); await sb.auth.refreshSession(); reload(); };
  };
  if ($('mfx')) $('mfx').onclick = async () => { if (D.settings.mfa_required) return toast('Désactivez d\'abord l\'obligation pour l\'équipe.', true); for (const x of tot) await sb.auth.mfa.unenroll({ factorId: x.id }); toast('Validation en deux étapes désactivée.'); reload(); };
  const savePrefs = async () => { if (await rpc('my_alert_prefs', { p_instant: $('ai').checked, p_weekly: $('aw').checked }, 'Préférences enregistrées.')) {} };
  $('ai').onchange = savePrefs; $('aw').onchange = savePrefs;
  $('atest').onclick = async () => { $('atest').disabled = true; const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/alerts', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: 'sb_publishable_0AT6IoJyfnTlANz0Lf-erg_Sj85F1yT' }, body: JSON.stringify({ action: 'test' }) });
    const j = await r.json().catch(() => ({})); $('atest').disabled = false; j.ok ? toast('E-mail de test envoyé à ' + j.to + '.') : toast(j.error || 'Envoi impossible.', true); };
  if ($('rr')) $('rr').onchange = async () => { if (await rpc('admin_setting_set', { p_key: 'nuittea_review_required', p_value: String($('rr').checked) }, 'Réglage enregistré.')) reload(); else $('rr').checked = !$('rr').checked; };
  if ($('mr')) $('mr').onchange = async () => { if (await rpc('admin_setting_set', { p_key: 'staff_mfa_required', p_value: String($('mr').checked) }, 'Réglage enregistré.')) reload(); else $('mr').checked = !$('mr').checked; };
}

$('lf').onsubmit = async e => { e.preventDefault(); $('lerr').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('le').value, password: $('lp').value }); if (error) return $('lerr').textContent = 'Identifiants incorrects.'; boot(); };
$('lg').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
$('mv').onclick = async () => { const { data: f } = await sb.auth.mfa.listFactors(); const t = (f.totp || [])[0]; if (!t) return; const { data: ch } = await sb.auth.mfa.challenge({ factorId: t.id }); const { error } = await sb.auth.mfa.verify({ factorId: t.id, challengeId: ch.id, code: $('mc').value.trim() }); if (error) return $('lerr').textContent = 'Code incorrect.'; $('lerr').textContent = ''; boot(); };
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !D) boot(); });
boot();
</script>
</body>
</html>
