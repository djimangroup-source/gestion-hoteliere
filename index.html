<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion hôtelière – Abonnements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F7F5F0;--card:#FFFFFF;--ink:#1B2430;--muted:#4A5563;--line:#E2DED4;--green:#0F5E4E;--green-d:#0A4236;--green-l:#DCEFE8;--gold:#B07D24;--gold-l:#F2D49B;--red:#8A2A14;--red-l:#FBE3DC;--amber:#7A4E0C;--amber-l:#FCF3E3;--blue:#1E4A80;--blue-l:#EEF3FA;--nav:#1B2430}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
button,input,select{font:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;padding:0 18px;font-weight:700;border:2px solid var(--green);background:#fff;color:var(--green)}
button.primary{background:var(--green);color:#fff}
button.gold{background:var(--gold-l);border-color:var(--gold-l);color:var(--ink)}
button.ghost{border:1px solid #C9C3B5;color:var(--ink);font-weight:600}
button.small{min-height:36px;padding:0 12px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{min-height:44px;border:1px solid #CFC9BC;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);width:100%}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
a{color:var(--green)}
.hidden{display:none!important}
.shell{display:flex;min-height:100vh;flex-wrap:wrap}
nav.side{width:240px;flex:1 1 240px;max-width:260px;background:var(--nav);color:#C9CED6;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
nav.side .brand{font-family:Fraunces,serif;color:#fff;font-size:20px;margin-bottom:6px}
nav.side .org{font-size:13px;margin-bottom:18px;color:#9AA3B2}
nav.side button{border:none;background:transparent;color:#C9CED6;text-align:left;font-weight:600;width:100%}
nav.side button.active{background:var(--green);color:#fff}
nav.side .spacer{flex:1}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.st-trial{background:var(--blue-l);color:var(--blue)}.st-active{background:var(--green-l);color:var(--green-d)}.st-past_due{background:var(--amber-l);color:var(--amber)}.st-expired{background:var(--red-l);color:var(--red)}.st-cancelled,.st-suspended{background:#ECE8DF;color:var(--muted)}
.st-succeeded{background:var(--green-l);color:var(--green-d)}.st-pending{background:var(--amber-l);color:var(--amber)}.st-failed,.st-refunded{background:var(--red-l);color:var(--red)}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;margin-bottom:22px;flex-wrap:wrap;font-weight:600}
.banner span{flex:1;min-width:200px}
.b-info{background:var(--blue-l);color:var(--blue)}.b-warn{background:var(--amber-l);color:var(--amber)}.b-danger{background:var(--red-l);color:var(--red)}
.toggle{display:inline-flex;gap:4px;background:#E7E3DA;padding:4px;border-radius:999px}
.toggle button{border:none;border-radius:999px;background:transparent;color:var(--ink);font-weight:600}
.toggle button.on{background:var(--green);color:#fff;font-weight:700}
.plan{position:relative;display:flex;flex-direction:column;gap:10px;border-radius:16px;padding:28px 22px;background:#fff;border:1px solid var(--line)}
.plan.reco{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 18px 40px rgba(15,94,78,.28)}
.plan.reco .muted{color:#CFE3DD}
.plan .badge{position:absolute;top:-13px;left:22px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:6px 12px;border-radius:999px}
.plan .price{font-size:30px;font-weight:700}
.plan .save{min-height:22px;font-size:13px;font-weight:700;color:var(--green)}
.plan.reco .save{color:var(--gold-l)}
.plan ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan li::before{content:"✓";font-weight:700;color:var(--green);margin-right:8px}
.plan.reco li::before{color:var(--gold-l)}
.plan.reco button{background:var(--gold-l);border-color:var(--gold-l);color:var(--ink)}
.bar{height:10px;background:#ECE8DF;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:var(--green)}
.bar.full>div{background:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto}
.table th{text-align:left;font-size:12px;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:12px 8px;border-bottom:1px solid #F0ECE3;vertical-align:middle}
.kpi .v{font-family:Fraunces,serif;font-size:28px;font-weight:600}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:100%;max-width:440px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:92vw;padding:14px 20px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(27,36,48,.55);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{width:100%;max-width:480px}
.big{font-family:Fraunces,serif;font-size:56px;line-height:1;color:var(--green)}
@media (max-width:700px){nav.side{max-width:none}}
</style>
</head>
<body>

<div id="auth" class="auth hidden">
  <div class="card">
    <div class="eyebrow">Gestion hôtelière &amp; résidences</div>
    <h1 id="authTitle" style="font-size:30px;margin:6px 0 18px">Connexion</h1>
    <form id="authForm">
      <div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" required minlength="8" autocomplete="current-password"></div>
      <button class="primary" style="width:100%" id="authBtn">Se connecter</button>
    </form>
    <p class="muted" style="margin:16px 0 0;font-size:14px"><span id="authSwitchTxt">Pas encore de compte ?</span> <a href="#" id="authSwitch">Créer un compte – 30 jours gratuits</a></p>
  </div>
</div>

<div id="onboard" class="auth hidden">
  <div class="card">
    <div class="eyebrow">Essai gratuit de 30 jours</div>
    <h1 style="font-size:28px;margin:6px 0 8px">Créez votre établissement</h1>
    <p class="muted" style="margin:0 0 18px">Votre période d'essai démarre dès la création.</p>
    <form id="onboardForm">
      <div class="field"><label for="orgName">Nom de l'organisation ou du groupe</label><input id="orgName" required minlength="2"></div>
      <div class="field"><label for="estName">Nom de l'établissement</label><input id="estName" required minlength="2"></div>
      <div class="field"><label for="estCity">Ville</label><input id="estCity"></div>
      <button class="primary" style="width:100%">Commencer l'essai gratuit</button>
    </form>
    <p style="margin:14px 0 0"><a href="#" data-logout>Se déconnecter</a></p>
  </div>
</div>

<div id="app" class="shell hidden">
  <nav class="side" aria-label="Navigation principale">
    <div class="brand">Gestion hôtelière</div>
    <div class="org" id="orgLabel"></div>
    <button data-view="dashboard">Tableau de bord</button>
    <button data-view="reservations">Réservations</button>
    <button data-view="planning">Planning</button>
    <button data-view="clients">Clients</button>
    <button data-view="chambres">Chambres</button>
    <button data-view="caisse">Caisse</button>
    <button data-view="factures">Factures</button>
    <div style="height:1px;background:rgba(255,255,255,.12);margin:10px 0"></div>
    <button data-view="abonnement">Mon abonnement</button>
    <button data-view="tarifs">Tarifs</button>
    <button data-view="admin" id="navAdmin" class="hidden">Administration</button>
    <div class="spacer"></div>
    <button data-logout>Se déconnecter</button>
  </nav>
  <main>
    <div id="banner"></div>
    <section id="v-dashboard" class="hidden"></section>
    <section id="v-reservations" class="hidden"></section>
    <section id="v-planning" class="hidden"></section>
    <section id="v-clients" class="hidden"></section>
    <section id="v-caisse" class="hidden"></section>
    <section id="v-factures" class="hidden"></section>
    <section id="v-tarifs" class="hidden"></section>
    <section id="v-abonnement" class="hidden"></section>
    <section id="v-chambres" class="hidden"></section>
    <section id="v-admin" class="hidden"></section>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="card" id="modalBody"></div></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
const SUPABASE_URL = 'https://kuuyhtvdnoqyikrcbpot.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0AT6IoJyfnTlANz0Lf-erg_Sj85F1yT';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { session:null, member:null, org:null, overview:null, plans:[], providers:[], isAdmin:false, cycle:'monthly', view:'dashboard', signup:false, est:null, ests:[], rooms:[] };
const VIEWS = ['dashboard','reservations','planning','clients','caisse','factures','tarifs','abonnement','chambres','admin'];
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa = (n) => n == null ? '—' : new Intl.NumberFormat('fr-FR').format(n).replace(/ | /g,' ') + ' FCFA';
const date = (d) => d ? new Date(d).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}) : '—';
const STATUS = { trial:'Essai', active:'Actif', past_due:'Échéance dépassée', expired:'Expiré', cancelled:'Résilié', suspended:'Suspendu' };
const PAYST = { pending:'En attente', succeeded:'Payé', failed:'Échoué', cancelled:'Annulé', refunded:'Remboursé' };
const CYCLE = { trial:'Essai', monthly:'Mensuel', yearly:'Annuel' };
const METHOD = { orange_money:'Orange Money', mtn_money:'MTN MoMo', moov_money:'Moov Money', wave:'Wave', card:'Carte bancaire', bank_transfer:'Virement bancaire', cash:'Espèces' };
const FEAT = { reception:'Réception & planning', reservations:'Réservations', clients:'Fiches clients', billing:'Facturation', payments:'Encaissements', cash:'Caisse', housekeeping:'Housekeeping', expenses:'Dépenses', basic_reports:'Rapports de base', users:'Utilisateurs', pdf_export:'Export PDF', advanced_reservations:'Réservations avancées', rates:'Tarifs', promotions:'Promotions', services:'Services', advanced_housekeeping:'Housekeeping avancé', maintenance:'Maintenance', financial_reports:'Rapports financiers', occupancy_stats:"Statistiques d'occupation", full_history:'Historique complet', excel_export:'Export Excel', user_permissions:'Permissions utilisateurs', notifications:'Notifications', restaurant:'Restaurant', bar:'Bar', orders:'Commandes', room_charge_transfer:'Transfert sur chambre', inventory:'Stocks', suppliers:'Fournisseurs', staff:'Personnel', groups:'Groupes', accounting:'Comptabilité simplifiée', advanced_dashboard:'Dashboard avancé', adr_revpar:'ADR & RevPAR', revenue_by_service:'CA par service', online_booking:'Réservation en ligne', online_payment:'Paiement en ligne', whatsapp_sms:'WhatsApp / SMS', api:'API', channel_manager:'Channel Manager', ota:'Connexion OTA', dynamic_pricing:'Tarification dynamique', revenue_management:'Revenue Management', advanced_crm:'CRM avancé', loyalty:'Fidélité', advanced_promotions:'Promotions avancées', whatsapp_automation:'Automatisation WhatsApp', custom_reports:'Rapports personnalisables', ai_assistant:'Assistant IA', smart_alerts:'Alertes intelligentes', advanced_api:'API avancée', full_audit:'Audit complet', multi_property:'Multi-établissements', multi_city:'Multi-villes', central_admin:'Administration centralisée', hotel_groups:'Groupes hôteliers', financial_consolidation:'Consolidation financière', national_dashboard:'Dashboard national', advanced_permissions:'Permissions avancées', custom_api:'API personnalisée', custom_integrations:'Intégrations spécifiques', data_migration:'Migration des données', training:'Formation', priority_support:'Support prioritaire' };

function toast(msg, err=false){ const t=$('toast'); t.textContent=msg; t.className='toast'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'), 5000); }
function errMsg(e){ return (e && (e.message || e.error_description)) || 'Une erreur est survenue.'; }
function modal(html){ $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
function show(id){ ['auth','onboard','app'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }

/* ---------- Authentification ---------- */
function renderAuth(){
  $('authTitle').textContent = S.signup ? 'Créer un compte' : 'Connexion';
  $('authBtn').textContent = S.signup ? 'Créer mon compte' : 'Se connecter';
  $('authSwitchTxt').textContent = S.signup ? 'Déjà inscrit ?' : 'Pas encore de compte ?';
  $('authSwitch').textContent = S.signup ? 'Se connecter' : 'Créer un compte – 30 jours gratuits';
  $('password').autocomplete = S.signup ? 'new-password' : 'current-password';
}
$('authSwitch').addEventListener('click', e => { e.preventDefault(); S.signup = !S.signup; renderAuth(); });
$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  const btn = $('authBtn'); btn.disabled = true;
  try {
    if (S.signup) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) { toast('Compte créé. Confirmez votre adresse e-mail puis connectez-vous.'); S.signup = false; renderAuth(); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) { toast(err.message === 'Invalid login credentials' ? 'Identifiants incorrects.' : errMsg(err), true); }
  finally { btn.disabled = false; }
});
document.addEventListener('click', async e => { if (e.target.closest('[data-logout]')) { e.preventDefault(); await sb.auth.signOut(); } });

$('onboardForm').addEventListener('submit', async e => {
  e.preventDefault();
  const b = e.submitter; if (b) b.disabled = true;
  const { error } = await sb.rpc('create_organization', { p_org_name: $('orgName').value.trim(), p_establishment_name: $('estName').value.trim(), p_city: $('estCity').value.trim() || null });
  if (b) b.disabled = false;
  if (error) return toast(errMsg(error), true);
  toast('Votre essai gratuit de 30 jours a démarré.');
  await boot();
});

/* ---------- Chargement ---------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  S.session = session;
  if (!session) { renderAuth(); return show('auth'); }
  const [mem, adm] = await Promise.all([
    sb.from('organization_members').select('organization_id, role, organizations(name)').eq('user_id', session.user.id).eq('is_active', true).limit(1),
    sb.rpc('is_platform_admin')
  ]);
  S.isAdmin = adm.data === true;
  S.member = mem.data && mem.data[0];
  $('navAdmin').classList.toggle('hidden', !S.isAdmin);
  if (!S.member) {
    if (S.isAdmin) { show('app'); $('orgLabel').textContent = 'Administrateur plateforme'; return go('admin'); }
    return show('onboard');
  }
  S.org = S.member.organization_id;
  $('orgLabel').textContent = S.member.organizations ? S.member.organizations.name : '';
  show('app');
  await loadCommon();
  go(S.view);
}
async function loadCommon(){
  const [ov, pl, pr] = await Promise.all([
    sb.rpc('get_subscription_overview', { p_org: S.org }),
    sb.from('plans').select('*').eq('is_active', true).eq('is_public', true).order('sort_order'),
    sb.from('payment_providers').select('code,name,kind').eq('is_active', true).order('sort_order')
  ]);
  if (ov.error) toast(errMsg(ov.error), true);
  S.overview = ov.data; S.plans = pl.data || []; S.providers = pr.data || [];
  renderBanner();
}
function renderBanner(){
  const o = S.overview, el = $('banner');
  if (!o || !o.alert) { el.innerHTML = ''; return; }
  const cls = o.status === 'expired' || o.status === 'suspended' ? 'b-danger' : (o.days_remaining <= 3 || o.status === 'past_due') ? 'b-warn' : 'b-info';
  el.innerHTML = `<div class="banner ${cls}" role="alert"><span>${esc(o.alert)}</span><button class="small primary" data-go="tarifs">Choisir une formule</button></div>`;
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
document.querySelectorAll('nav.side [data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

function go(view){
  if (view === 'admin' && !S.isAdmin) view = 'abonnement';
  if (!S.org && view !== 'admin') view = 'admin';
  S.view = view;
  document.querySelectorAll('nav.side [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  VIEWS.forEach(v => $('v-'+v).classList.toggle('hidden', v !== view));
  ({ dashboard: renderDashboard, reservations: renderReservations, planning: renderPlanning, clients: renderClients, caisse: renderCaisse, factures: renderFactures, tarifs: renderTarifs, abonnement: renderAbonnement, chambres: renderChambres, admin: renderAdmin })[view]();
}

/* ---------- Tarifs ---------- */
function renderTarifs(){
  const o = S.overview || {}; const cur = o.plan || {};
  const trial = S.plans.find(p => p.is_trial);
  const paid = S.plans.filter(p => !p.is_trial && !p.is_quote_based);
  const ent = S.plans.find(p => p.is_quote_based);
  const y = S.cycle === 'yearly';
  const cards = paid.map(p => {
    const isCur = cur.id === p.id && o.billing_cycle === S.cycle && o.status !== 'expired';
    const save = p.monthly_price * 12 - (p.yearly_price || 0);
    const label = isCur ? 'Formule actuelle' : (o.billing_cycle && o.billing_cycle !== 'trial' ? 'Passer à cette formule' : 'Choisir cette formule');
    const prev = paid[paid.indexOf(p) - 1];
    const feats = (p.features || []).filter(f => !prev || !(prev.features || []).includes(f)).slice(0, 9).map(f => `<li>${esc(FEAT[f] || f)}</li>`).join('');
    return `<div class="plan ${p.is_recommended ? 'reco' : ''}">
      ${p.is_recommended ? '<div class="badge">RECOMMANDÉ</div>' : ''}
      <h3 style="font-size:24px">${esc(p.name)}</h3>
      <div class="muted" style="font-size:13px">${p.max_rooms ? "Jusqu'à " + p.max_rooms + ' chambres/unités' : 'Selon configuration'} · ${p.max_users ? p.max_users + ' utilisateurs' : 'utilisateurs illimités'}</div>
      <div><span class="price">${fcfa(y ? p.yearly_price : p.monthly_price).replace(' FCFA','')}</span> <span class="muted" style="font-size:13px">FCFA / ${y ? 'an' : 'mois'}</span></div>
      <div class="save">${y && save > 0 ? 'Économisez ' + fcfa(save) + ' avec l’annuel' : ''}</div>
      <button data-checkout="${esc(p.slug)}" ${isCur ? 'disabled' : ''}>${label}</button>
      <ul>${prev ? '<li>Tout ' + esc(prev.name) + ' +</li>' : ''}${feats}</ul>
    </div>`;
  }).join('');
  $('v-tarifs').innerHTML = `
    <div style="text-align:center;margin-bottom:26px">
      <div class="eyebrow">Gestion hôtelière &amp; résidences</div>
      <h1 style="font-size:clamp(28px,4vw,42px);margin:8px 0">Choisissez la formule adaptée à votre établissement</h1>
      <p class="muted" style="margin:0 0 16px">Vos données sont toujours conservées, même après expiration.</p>
      <div class="toggle" role="group" aria-label="Périodicité">
        <button class="${y ? '' : 'on'}" data-cycle="monthly">Mensuel</button>
        <button class="${y ? 'on' : ''}" data-cycle="yearly">Annuel · 2 mois offerts</button>
      </div>
    </div>
    <div class="grid g4" style="align-items:stretch;margin-bottom:18px">${cards}</div>
    <div class="grid g2">
      ${trial ? `<div class="card row between"><div><h3 style="font-size:20px">${esc(trial.name)} · ${trial.trial_days} jours</h3><div class="muted" style="font-size:14px">0 FCFA · ${trial.max_rooms} chambres · ${trial.max_users} utilisateurs · 1 caisse · 1 devise</div></div>
        <button class="${o.billing_cycle === 'trial' ? '' : 'ghost'}" disabled>${o.billing_cycle === 'trial' ? 'Essai en cours' : 'Essai déjà utilisé'}</button></div>` : ''}
      ${ent ? `<div class="card row between" style="background:var(--ink);color:#fff;border-color:var(--ink)"><div><h3 style="font-size:20px">${esc(ent.name)}</h3><div style="font-size:14px;color:#C9CED6">À partir de ${fcfa(ent.monthly_price)}/mois · ${esc(ent.description || '')}</div></div>
        <button class="gold" data-quote>Demander un devis</button></div>` : ''}
    </div>`;
  $('v-tarifs').querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { S.cycle = b.dataset.cycle; renderTarifs(); });
  $('v-tarifs').querySelectorAll('[data-checkout]').forEach(b => b.onclick = () => openCheckout(b.dataset.checkout, S.cycle));

}

function openCheckout(slug, cycle){
  if (!['owner','admin'].includes(S.member.role)) return toast("Seul le propriétaire ou un administrateur peut gérer l'abonnement.", true);
  const p = S.plans.find(x => x.slug === slug); if (!p) return;
  const amount = cycle === 'yearly' ? p.yearly_price : p.monthly_price;
  const opts = S.providers.map(pr => `<option value="${esc(pr.code)}">${esc(pr.name)}</option>`).join('');
  modal(`<h2 style="font-size:24px">${esc(p.name)} · ${CYCLE[cycle]}</h2>
    <p style="font-size:28px;font-weight:700;margin:10px 0 2px">${fcfa(amount)}</p>
    <p class="muted" style="margin:0 0 16px">${cycle === 'yearly' ? 'Valable 1 an' : 'Valable 1 mois'} à compter de l'activation.</p>
    ${S.providers.length ? `<div class="field"><label for="payMethod">Moyen de paiement</label><select id="payMethod">${opts}</select></div>
      <p class="muted" style="font-size:13px">Les paiements Mobile Money et carte seront proposés dès l'ouverture de ces services.</p>
      <div class="row"><button class="primary" id="payGo">Confirmer la demande</button><button class="ghost" data-close>Annuler</button></div>`
      : `<p class="muted">Aucun moyen de paiement n'est disponible pour le moment.</p><button class="ghost" data-close>Fermer</button>`}`);
  const g = $('payGo'); if (!g) return;
  g.onclick = async () => {
    g.disabled = true;
    const method = $('payMethod').value;
    const { data, error } = await sb.rpc('start_subscription_checkout', { p_org: S.org, p_plan_slug: slug, p_cycle: cycle, p_method: method });
    if (error) { g.disabled = false; return toast(errMsg(error), true); }
    const ref = String(data).slice(0, 8).toUpperCase();
    modal(`<h2 style="font-size:24px">Demande enregistrée</h2>
      <p>Référence de paiement : <strong>${ref}</strong> — montant : <strong>${fcfa(amount)}</strong>.</p>
      <p class="muted">${method === 'bank_transfer' ? 'Effectuez le virement en indiquant cette référence.' : 'Réglez ce montant en espèces en indiquant cette référence.'} Votre abonnement sera activé dès la validation du paiement.</p>
      <button class="primary" data-close>Compris</button>`);
    await loadCommon(); if (S.view === 'abonnement') renderAbonnement();
  };
}

  if (!i) return;
  const w = window.open('', '_blank');
  if (!w) return toast("Autorisez l'ouverture de fenêtres pour imprimer la facture.", true);
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Facture ${esc(i.number)}</title><style>body{font:15px/1.5 system-ui,sans-serif;color:#1B2430;max-width:720px;margin:40px auto;padding:0 20px}h1{font-size:26px;margin:0}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}</style></head><body>
  <h1>Facture ${esc(i.number)}</h1><p>Émise le ${date(i.issued_at)}<br>Client : ${esc($('orgLabel').textContent)}</p>
  <table><tr><th>Désignation</th><th>Période</th><th class="r">Montant</th></tr>
  <tr><td>Abonnement ${esc(i.plan_name)} (${CYCLE[i.billing_cycle] || esc(i.billing_cycle)})</td><td>${date(i.period_start)} – ${date(i.period_end)}</td><td class="r">${fcfa(i.amount)}</td></tr>
  <tr><th colspan="2" class="r">Total payé</th><th class="r">${fcfa(i.amount)}</th></tr></table>
  <script>window.print()<\/script></body></html>`);
  w.document.close();
}

  });
  el.querySelectorAll('[data-status]').forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc('admin_set_subscription_status', { p_org: b.dataset.org, p_status: b.dataset.status, p_until: null, p_reason: b.dataset.status === 'suspended' ? 'Suspension administrative' : null });
    if (error) return toast(errMsg(error), true); toast('Statut mis à jour.'); renderAdmin();
  });
  el.querySelectorAll('[data-saveplan]').forEach(b => b.onclick = async () => {
    const id = b.dataset.saveplan;
    const { error } = await sb.from('plans').update({ monthly_price: num('pm-' + id) ?? 0, yearly_price: num('py-' + id), max_rooms: num('pr-' + id), max_users: num('pu-' + id), is_active: $('pa-' + id).checked }).eq('id', id);
    if (error) return toast(errMsg(error), true); toast('Formule enregistrée.');
  });
}

/* ================= Modules métier ================= */
const RSTATUS = { pending:'En attente', confirmed:'Confirmée', checked_in:'En séjour', checked_out:'Partie', cancelled:'Annulée', no_show:'Non présentée' };
const RSTCLS = { pending:'st-pending', confirmed:'st-trial', checked_in:'st-active', checked_out:'st-cancelled', cancelled:'st-expired', no_show:'st-expired' };
const SOURCE = { direct:'Direct', telephone:'Téléphone', walk_in:'Walk-in', whatsapp:'WhatsApp', agence:'Agence', en_ligne:'En ligne' };
const PMETHOD = { cash:'Espèces', orange_money:'Orange Money', mtn_money:'MTN MoMo', moov_money:'Moov Money', wave:'Wave', card:'Carte', bank_transfer:'Virement' };
const HKS = { clean:'Propre', dirty:'Sale', cleaning:'En nettoyage', ready:'Prête', out_of_service:'Hors service' };
const money = (n) => new Intl.NumberFormat('fr-FR').format(Math.round(Number(n || 0))).replace(/ | /g,' ') + ' F';
const iso = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dfr = (s) => s ? new Date(s + (s.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) : '—';
const opt = (obj, sel) => Object.entries(obj).map(([k,v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
const can = (roles) => S.member && roles.includes(S.member.role);

async function loadEst(){
  const [e, r] = await Promise.all([
    sb.from('establishments').select('id,name,city').eq('organization_id', S.org).eq('is_active', true).order('created_at'),
    sb.from('rooms').select('id,number,room_type,base_rate,housekeeping_status,is_active,establishment_id').eq('organization_id', S.org).eq('is_active', true).order('number')
  ]);
  S.ests = e.data || []; if (!S.est || !S.ests.find(x => x.id === S.est)) S.est = S.ests[0] && S.ests[0].id;
  S.rooms = (r.data || []).filter(x => x.establishment_id === S.est);
}
const head = (title, right='') => `<div class="row between" style="margin-bottom:20px"><h1 style="font-size:32px">${title}</h1><div class="row">${right}</div></div>`;
function readOnlyNote(){ return S.overview && !S.overview.can_write ? `<p class="muted" style="margin:-8px 0 16px">Consultation seule : réactivez votre abonnement pour enregistrer de nouvelles opérations.</p>` : ''; }

/* ---------- Tableau de bord ---------- */
async function renderDashboard(){
  const el = $('v-dashboard'); el.innerHTML = '<p class="muted">Chargement…</p>';
  await loadEst();
  const t = today();
  const [arr, dep, inh, pay] = await Promise.all([
    sb.from('reservation_balances').select('*').eq('establishment_id', S.est).eq('check_in', t).in('status', ['pending','confirmed']),
    sb.from('reservation_balances').select('*').eq('establishment_id', S.est).eq('check_out', t).eq('status', 'checked_in'),
    sb.from('reservation_balances').select('id').eq('establishment_id', S.est).eq('status', 'checked_in'),
    can(['owner','admin','manager','receptionist','accountant']) ? sb.from('cash_movements').select('amount,kind').eq('establishment_id', S.est).gte('created_at', t + 'T00:00:00') : { data: [] }
  ]);
  const total = S.rooms.length, occ = (inh.data || []).length;
  const cashIn = (pay.data || []).filter(m => m.kind === 'payment' || m.kind === 'income').reduce((a, m) => a + Number(m.amount), 0);
  const hk = (s) => S.rooms.filter(r => r.housekeeping_status === s).length;
  const k = (l, v, sub='') => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${sub ? `<div class="muted" style="font-size:12px">${sub}</div>` : ''}</div>`;
  const list = (rows, action, label) => (rows || []).length === 0 ? '<p class="muted">Aucun.</p>' : `<div class="tablewrap"><table class="table"><tbody>${rows.map(r => `<tr><td><strong>${esc(r.guest_name)}</strong><div class="muted" style="font-size:12px">Ch. ${esc(r.room_number)} · ${r.nights} nuit(s)</div></td><td>${r.balance > 0 ? `<span class="pill st-pending">Solde ${money(r.balance)}</span>` : '<span class="pill st-active">Réglé</span>'}</td><td style="text-align:right"><button class="small primary" data-${action}="${r.id}">${label}</button></td></tr>`).join('')}</tbody></table></div>`;
  el.innerHTML = head(`Tableau de bord <span class="muted" style="font-size:16px;font-family:Manrope">· ${new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</span>`,
      `<button class="primary" data-newresa>Nouvelle réservation</button><button data-walkin>Walk-in</button>`) + readOnlyNote() + `
    <div class="grid g4" style="margin-bottom:16px">
      ${k("Taux d'occupation", total ? Math.round(occ / total * 100) + ' %' : '—', `${occ} / ${total} chambres occupées`)}
      ${k('Arrivées du jour', (arr.data || []).length)}${k('Départs du jour', (dep.data || []).length)}
      ${k('Encaissé aujourd’hui', money(cashIn))}
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><h3 style="font-size:20px;margin-bottom:8px">Arrivées</h3>${list(arr.data, 'checkin', 'Check-in')}</div>
      <div class="card"><h3 style="font-size:20px;margin-bottom:8px">Départs</h3>${list(dep.data, 'checkout', 'Check-out')}</div>
    </div>
    <div class="card"><h3 style="font-size:20px;margin-bottom:10px">État des chambres</h3>
      <div class="row">${Object.entries(HKS).map(([kk, v]) => `<span class="pill ${kk === 'clean' || kk === 'ready' ? 'st-active' : kk === 'dirty' ? 'st-pending' : kk === 'out_of_service' ? 'st-expired' : 'st-trial'}">${v} : ${hk(kk)}</span>`).join('')}</div></div>`;
  bindResaActions(el, renderDashboard);
}

/* ---------- Réservations ---------- */
async function renderReservations(){
  const el = $('v-reservations'); el.innerHTML = '<p class="muted">Chargement…</p>';
  await loadEst();
  const f = S._rf || { from: addDays(today(), -7), status: 'active', q: '' };
  let q = sb.from('reservation_balances').select('*').eq('establishment_id', S.est).gte('check_out', f.from).order('check_in').limit(300);
  if (f.status === 'active') q = q.in('status', ['pending','confirmed','checked_in']); else if (f.status !== 'all') q = q.eq('status', f.status);
  const { data, error } = await q; if (error) toast(errMsg(error), true);
  const rows = (data || []).filter(r => !f.q || (r.guest_name + ' ' + r.room_number + ' ' + (r.guest_phone || '')).toLowerCase().includes(f.q.toLowerCase()));
  el.innerHTML = head('Réservations', `<button class="primary" data-newresa>Nouvelle réservation</button>`) + readOnlyNote() + `
    <div class="card row" style="margin-bottom:14px;align-items:flex-end">
      <div style="flex:1 1 180px"><label for="rfQ">Recherche</label><input id="rfQ" value="${esc(f.q)}" placeholder="Client, chambre, téléphone"></div>
      <div style="flex:1 1 150px"><label for="rfFrom">Départ à partir du</label><input id="rfFrom" type="date" value="${f.from}"></div>
      <div style="flex:1 1 160px"><label for="rfSt">Statut</label><select id="rfSt"><option value="active">En cours et à venir</option><option value="all">Toutes</option>${opt(RSTATUS, f.status)}</select></div>
    </div>
    <div class="card">${rows.length === 0 ? '<p class="muted">Aucune réservation.</p>' : `<div class="tablewrap"><table class="table"><thead><tr><th>Client</th><th>Ch.</th><th>Arrivée</th><th>Départ</th><th>Nuits</th><th>Total</th><th>Solde</th><th>Statut</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><strong>${esc(r.guest_name)}</strong><div class="muted" style="font-size:12px">${esc(r.guest_phone || '')} · ${SOURCE[r.source] || ''}</div></td><td>${esc(r.room_number)}</td><td>${dfr(r.check_in)}</td><td>${dfr(r.check_out)}</td><td>${r.nights}</td><td>${money(r.total_amount)}</td><td>${r.balance > 0 ? `<strong style="color:var(--amber)">${money(r.balance)}</strong>` : '<span style="color:var(--green)">0 F</span>'}</td><td><span class="pill ${RSTCLS[r.status]}">${RSTATUS[r.status]}</span></td><td><button class="small ghost" data-open="${r.id}">Ouvrir</button></td></tr>`).join('')}
    </tbody></table></div>`}</div>`;
  $('rfSt').value = f.status;
  const upd = () => { S._rf = { from: $('rfFrom').value || f.from, status: $('rfSt').value, q: $('rfQ').value }; renderReservations(); };
  $('rfFrom').onchange = upd; $('rfSt').onchange = upd; $('rfQ').onchange = upd;
  bindResaActions(el, renderReservations);
}

function bindResaActions(el, refresh){
  el.querySelectorAll('[data-newresa]').forEach(b => b.onclick = () => openResaForm({}, refresh));
  el.querySelectorAll('[data-walkin]').forEach(b => b.onclick = () => openResaForm({ walkin: true }, refresh));
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openResa(b.dataset.open, refresh));
  el.querySelectorAll('[data-checkin]').forEach(b => b.onclick = async () => { const { error } = await sb.rpc('check_in_reservation', { p_reservation: b.dataset.checkin }); if (error) return toast(errMsg(error), true); toast('Client enregistré en chambre.'); refresh(); });
  el.querySelectorAll('[data-checkout]').forEach(b => b.onclick = () => openResa(b.dataset.checkout, refresh, true));
}

async function openResaForm(pre, refresh){
  if (!S.rooms.length) await loadEst();
  if (!S.rooms.length) return toast('Ajoutez d’abord des chambres.', true);
  const ci = pre.check_in || today(), co = pre.check_out || addDays(ci, 1);
  const { data: guests } = await sb.from('guests').select('id,full_name,phone').eq('organization_id', S.org).order('full_name').limit(500);
  modal(`<h2 style="font-size:24px;margin-bottom:12px">${pre.walkin ? 'Walk-in (arrivée immédiate)' : pre.id ? 'Modifier la réservation' : 'Nouvelle réservation'}</h2>
    <form id="resaForm">
      <div class="field"><label for="fGuest">Client existant</label><select id="fGuest"><option value="">— Nouveau client —</option>${(guests || []).map(g => `<option value="${g.id}" ${pre.guest_id === g.id ? 'selected' : ''}>${esc(g.full_name)}${g.phone ? ' · ' + esc(g.phone) : ''}</option>`).join('')}</select></div>
      <div class="row" id="newGuest"><div style="flex:1 1 180px" class="field"><label for="fName">Nom complet</label><input id="fName" value="${esc(pre.guest_name || '')}"></div><div style="flex:1 1 140px" class="field"><label for="fPhone">Téléphone</label><input id="fPhone" value="${esc(pre.guest_phone || '')}"></div></div>
      <div class="row"><div style="flex:1 1 140px" class="field"><label for="fIn">Arrivée</label><input id="fIn" type="date" required value="${ci}" ${pre.walkin ? 'readonly' : ''}></div><div style="flex:1 1 140px" class="field"><label for="fOut">Départ</label><input id="fOut" type="date" required value="${co}"></div></div>
      <div class="field"><label for="fRoom">Chambre</label><select id="fRoom">${S.rooms.map(r => `<option value="${r.id}" data-rate="${r.base_rate || 0}" ${pre.room_id === r.id ? 'selected' : ''}>${esc(r.number)}${r.room_type ? ' · ' + esc(r.room_type) : ''}${r.housekeeping_status === 'out_of_service' ? ' (hors service)' : ''}</option>`).join('')}</select><div class="muted" id="fAvail" style="font-size:12px;margin-top:4px"></div></div>
      <div class="row"><div style="flex:1 1 120px" class="field"><label for="fRate">Prix / nuit (F)</label><input id="fRate" type="number" min="0" required value="${pre.nightly_rate ?? ''}"></div><div style="flex:1 1 100px" class="field"><label for="fDisc">Remise (F)</label><input id="fDisc" type="number" min="0" value="${pre.discount || 0}"></div><div style="flex:1 1 80px" class="field"><label for="fAd">Adultes</label><input id="fAd" type="number" min="1" value="${pre.adults || 1}"></div></div>
      <div class="row"><div style="flex:1 1 140px" class="field"><label for="fSrc">Origine</label><select id="fSrc">${opt(SOURCE, pre.walkin ? 'walk_in' : (pre.source || 'direct'))}</select></div><div style="flex:2 1 200px" class="field"><label for="fNotes">Notes</label><input id="fNotes" value="${esc(pre.notes || '')}"></div></div>
      <p style="font-weight:700;margin:4px 0 14px" id="fTotal"></p>
      <div class="row"><button class="primary">${pre.id ? 'Enregistrer' : pre.walkin ? 'Enregistrer et faire le check-in' : 'Créer la réservation'}</button><button type="button" class="ghost" data-close>Annuler</button></div>
    </form>`);
  const calc = () => {
    const n = Math.max(0, (new Date($('fOut').value) - new Date($('fIn').value)) / 864e5);
    $('fTotal').textContent = n > 0 ? `${n} nuit(s) · Total ${money(Math.max(0, n * (+$('fRate').value || 0) - (+$('fDisc').value || 0)))}` : 'La date de départ doit suivre la date d’arrivée.';
    $('newGuest').classList.toggle('hidden', !!$('fGuest').value);
  };
  const avail = async () => {
    const { data } = await sb.from('reservations').select('id,room_id').eq('establishment_id', S.est).not('status', 'in', '(cancelled,no_show,checked_out)').lt('check_in', $('fOut').value).gt('check_out', $('fIn').value);
    const busy = new Set((data || []).filter(x => x.id !== pre.id).map(x => x.room_id));
    [...$('fRoom').options].forEach(o => { o.disabled = busy.has(o.value); });
    if ($('fRoom').selectedOptions[0] && $('fRoom').selectedOptions[0].disabled) { const f = [...$('fRoom').options].find(o => !o.disabled); if (f) $('fRoom').value = f.value; }
    $('fAvail').textContent = `${S.rooms.length - busy.size} chambre(s) disponible(s) sur la période.`;
    if (!$('fRate').value) $('fRate').value = $('fRoom').selectedOptions[0] ? $('fRoom').selectedOptions[0].dataset.rate : 0;
    calc();
  };
  ['fRate','fDisc','fGuest'].forEach(id => $(id).oninput = calc);
  $('fIn').onchange = avail; $('fOut').onchange = avail;
  $('fRoom').onchange = () => { $('fRate').value = $('fRoom').selectedOptions[0].dataset.rate || 0; calc(); };
  await avail();
  $('resaForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try {
      let gid = $('fGuest').value || null;
      if (!gid) {
        const nm = $('fName').value.trim(); if (nm.length < 2) throw new Error('Indiquez le nom du client.');
        const g = await sb.from('guests').insert({ organization_id: S.org, full_name: nm, phone: $('fPhone').value.trim() || null }).select('id').single();
        if (g.error) throw g.error; gid = g.data.id;
      }
      const row = { establishment_id: S.est, room_id: $('fRoom').value, guest_id: gid, guest_name: '-', check_in: $('fIn').value, check_out: $('fOut').value, nightly_rate: +$('fRate').value || 0, discount: +$('fDisc').value || 0, adults: +$('fAd').value || 1, source: $('fSrc').value, notes: $('fNotes').value.trim() || null };
      const res = pre.id ? await sb.from('reservations').update(row).eq('id', pre.id).select('id').single() : await sb.from('reservations').insert({ ...row, status: 'confirmed', created_by: S.session.user.id }).select('id').single();
      if (res.error) throw (res.error.message || '').includes('no_double_booking') ? new Error('Cette chambre est déjà réservée sur ces dates.') : res.error;
      if (pre.walkin) { const c = await sb.rpc('check_in_reservation', { p_reservation: res.data.id }); if (c.error) throw c.error; }
      closeModal(); toast(pre.id ? 'Réservation modifiée.' : pre.walkin ? 'Client enregistré en chambre.' : 'Réservation créée.');
      refresh();
    } catch (err) { btn.disabled = false; toast(errMsg(err), true); }
  };
}

async function openResa(id, refresh, focusCheckout){
  const [{ data: r }, { data: pays }] = await Promise.all([
    sb.from('reservation_balances').select('*').eq('id', id).single(),
    can(['owner','admin','manager','receptionist','accountant']) ? sb.from('cash_movements').select('created_at,kind,method,amount,label,reference').eq('reservation_id', id).order('created_at') : { data: [] }
  ]);
  if (!r) return toast('Réservation introuvable.', true);
  const active = ['pending','confirmed','checked_in'].includes(r.status);
  modal(`<div class="row between"><h2 style="font-size:24px">${esc(r.guest_name)}</h2><span class="pill ${RSTCLS[r.status]}">${RSTATUS[r.status]}</span></div>
    <p class="muted" style="margin:4px 0 14px">Chambre ${esc(r.room_number)} · ${dfr(r.check_in)} → ${dfr(r.check_out)} · ${r.nights} nuit(s) · ${SOURCE[r.source]}${r.notes ? '<br>' + esc(r.notes) : ''}</p>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;text-align:center">
      <div class="card" style="padding:12px"><div class="muted" style="font-size:12px">Total</div><strong>${money(r.total_amount)}</strong></div>
      <div class="card" style="padding:12px"><div class="muted" style="font-size:12px">Payé</div><strong style="color:var(--green)">${money(r.paid)}</strong></div>
      <div class="card" style="padding:12px"><div class="muted" style="font-size:12px">Solde</div><strong style="color:${r.balance > 0 ? 'var(--amber)' : 'var(--green)'}">${money(r.balance)}</strong></div>
    </div>
    ${(pays || []).length ? `<div style="font-size:13px;margin-bottom:14px">${pays.map(p => `<div class="row between" style="border-bottom:1px solid #F0ECE3;padding:6px 0"><span>${new Date(p.created_at).toLocaleDateString('fr-FR')} · ${esc(p.label)} · ${PMETHOD[p.method]}</span><strong>${p.kind === 'refund' ? '−' : ''}${money(p.amount)}</strong></div>`).join('')}</div>` : ''}
    ${active && r.balance > 0 && can(['owner','admin','manager','receptionist','accountant']) ? `<form id="payForm" class="row" style="align-items:flex-end;margin-bottom:14px">
      <div style="flex:1 1 110px"><label for="pAmt">Encaisser (F)</label><input id="pAmt" type="number" min="1" max="${r.balance}" value="${r.balance}" required></div>
      <div style="flex:1 1 130px"><label for="pMeth">Moyen</label><select id="pMeth">${opt(PMETHOD, 'cash')}</select></div>
      <div style="flex:1 1 110px"><label for="pRef">Référence</label><input id="pRef" placeholder="N° transaction"></div>
      <button class="primary">Encaisser</button></form>` : ''}
    <div class="row">
      ${['pending','confirmed'].includes(r.status) ? `<button class="primary" id="aIn">Check-in</button>` : ''}
      ${r.status === 'checked_in' ? `<button class="primary" id="aOut">Check-out</button>` : ''}
      ${r.status !== 'cancelled' ? `<button id="aInv">Facture</button>` : ''}
      ${active ? `<button class="ghost" id="aEdit">Modifier / prolonger</button>` : ''}
      ${['pending','confirmed'].includes(r.status) ? `<button class="ghost" id="aCancel">Annuler la réservation</button>` : ''}
      <button class="ghost" data-close>Fermer</button>
    </div>`);
  const done = (m) => { toast(m); closeModal(); refresh(); };
  const pf = $('payForm'); if (pf) pf.onsubmit = async (e) => { e.preventDefault(); e.submitter.disabled = true;
    const { error } = await sb.from('cash_movements').insert({ establishment_id: r.establishment_id, reservation_id: r.id, kind: 'payment', method: $('pMeth').value, amount: +$('pAmt').value, label: r.status === 'checked_in' ? 'Paiement séjour' : 'Acompte', reference: $('pRef').value.trim() || null });
    if (error) { e.submitter.disabled = false; return toast(errMsg(error), true); } toast('Paiement enregistré.'); openResa(id, refresh); };
  const a = (x, fn) => { const b = $(x); if (b) b.onclick = fn; };
  a('aIn', async () => { const { error } = await sb.rpc('check_in_reservation', { p_reservation: r.id }); if (error) return toast(errMsg(error), true); done('Client enregistré en chambre.'); });
  a('aOut', async () => { if (r.balance > 0 && !$('aOut').dataset.confirm) { $('aOut').dataset.confirm = 1; $('aOut').textContent = `Solde ${money(r.balance)} impayé — confirmer le départ`; return; }
    const { error } = await sb.rpc('check_out_reservation', { p_reservation: r.id }); if (error) return toast(errMsg(error), true); done('Départ enregistré. Chambre à nettoyer.'); });
  a('aInv', async () => { const { data, error } = await sb.rpc('issue_guest_invoice', { p_reservation: r.id }); if (error) return toast(errMsg(error), true); const { data: inv } = await sb.from('guest_invoices').select('*').eq('id', data).single(); printGuestInvoice(inv); });
  a('aEdit', () => openResaForm(r, refresh));
  a('aCancel', async () => { if (!$('aCancel').dataset.confirm) { $('aCancel').dataset.confirm = 1; $('aCancel').textContent = 'Confirmer l’annulation'; return; }
    const { error } = await sb.from('reservations').update({ status: 'cancelled' }).eq('id', r.id); if (error) return toast(errMsg(error), true); done('Réservation annulée.'); });
  if (focusCheckout && $('aOut')) $('aOut').focus();
}

function printGuestInvoice(i){
  if (!i) return;
  const est = S.ests.find(e => e.id === i.establishment_id) || {};
  const w = window.open('', '_blank'); if (!w) return toast("Autorisez l'ouverture de fenêtres pour imprimer.", true);
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Facture ${esc(i.number)}</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#1B2430;max-width:760px;margin:36px auto;padding:0 20px}h1{font-size:24px;margin:0}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}.top{display:flex;justify-content:space-between;gap:20px}</style></head><body>
  <div class="top"><div><h1>${esc(est.name || '')}</h1><div>${esc(est.city || '')}</div></div><div class="r"><strong>FACTURE ${esc(i.number)}</strong><br>Émise le ${new Date(i.issued_at).toLocaleDateString('fr-FR')}</div></div>
  <p style="margin-top:24px">Client : <strong>${esc(i.guest_name)}</strong></p>
  <table><tr><th>Désignation</th><th class="r">Qté</th><th class="r">P.U.</th><th class="r">Montant</th></tr>
  ${(i.lines || []).map(l => `<tr><td>${esc(l.label)}</td><td class="r">${l.qty}</td><td class="r">${money(l.unit)}</td><td class="r">${money(l.amount)}</td></tr>`).join('')}
  <tr><th colspan="3" class="r">Total</th><th class="r">${money(i.total)}</th></tr><tr><td colspan="3" class="r">Déjà réglé</td><td class="r">${money(i.paid)}</td></tr><tr><th colspan="3" class="r">Reste à payer</th><th class="r">${money(i.balance)}</th></tr></table>
  <p style="margin-top:30px;font-size:12px;color:#666">Montants en francs CFA (XOF).</p><script>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ---------- Planning ---------- */
async function renderPlanning(){
  const el = $('v-planning'); el.innerHTML = '<p class="muted">Chargement…</p>';
  await loadEst();
  const start = S._ps || addDays(today(), -1), days = 14, end = addDays(start, days);
  const { data } = await sb.from('reservations').select('id,room_id,guest_name,check_in,check_out,status').eq('establishment_id', S.est).not('status', 'in', '(cancelled,no_show)').lt('check_in', end).gt('check_out', start);
  const dates = [...Array(days)].map((_, i) => addDays(start, i));
  const col = { pending:'#F2D49B', confirmed:'#BFD3EE', checked_in:'#0F5E4E', checked_out:'#D6D1C6' };
  const cell = 52;
  el.innerHTML = head('Planning', `<button class="ghost small" id="pPrev">← 7 jours</button><button class="ghost small" id="pToday">Aujourd'hui</button><button class="ghost small" id="pNext">7 jours →</button><button class="primary small" data-newresa>Nouvelle réservation</button>`) + `
    <div class="card" style="padding:0;overflow-x:auto"><div style="min-width:${110 + days * cell}px">
      <div style="display:grid;grid-template-columns:110px repeat(${days},${cell}px);position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line)">
        <div style="padding:10px;font-size:12px;font-weight:700;color:var(--muted)">Chambre</div>
        ${dates.map(d => `<div style="padding:8px 0;text-align:center;font-size:11px;${d === today() ? 'background:var(--green-l);font-weight:700' : ''}">${new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday:'short' })}<br><strong>${d.slice(8)}</strong></div>`).join('')}
      </div>
      ${S.rooms.map(rm => { const rs = (data || []).filter(x => x.room_id === rm.id);
        return `<div style="display:grid;grid-template-columns:110px repeat(${days},${cell}px);position:relative;border-bottom:1px solid #F0ECE3;height:46px">
          <div style="padding:12px 10px;font-weight:700">${esc(rm.number)} <span class="muted" style="font-weight:400;font-size:11px">${HKS[rm.housekeeping_status] === 'Propre' ? '' : esc(HKS[rm.housekeeping_status])}</span></div>
          ${dates.map(d => `<button aria-label="Réserver ${esc(rm.number)} le ${d}" data-slot="${rm.id}|${d}" style="min-height:46px;border:none;border-left:1px solid #F4F1EA;border-radius:0;background:transparent;padding:0"></button>`).join('')}
          ${rs.map(x => { const a = Math.max(0, (new Date(x.check_in) - new Date(start)) / 864e5), b = Math.min(days, (new Date(x.check_out) - new Date(start)) / 864e5);
            return `<button data-open="${x.id}" title="${esc(x.guest_name)}" style="position:absolute;top:6px;height:34px;min-height:34px;left:${110 + a * cell + cell / 2}px;width:${Math.max(cell / 2, (b - a) * cell - 4)}px;background:${col[x.status]};color:${x.status === 'checked_in' ? '#fff' : '#1B2430'};border:none;border-radius:8px;font-size:12px;font-weight:700;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left">${esc(x.guest_name)}</button>`; }).join('')}
        </div>`; }).join('') || '<p class="muted" style="padding:16px">Aucune chambre.</p>'}
    </div></div>
    <div class="row" style="margin-top:10px;font-size:12px">${Object.entries(col).map(([k, c]) => `<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${c};vertical-align:middle"></span> ${RSTATUS[k]}</span>`).join('')}<span class="muted">· Cliquez sur une case vide pour réserver.</span></div>`;
  $('pPrev').onclick = () => { S._ps = addDays(start, -7); renderPlanning(); };
  $('pNext').onclick = () => { S._ps = addDays(start, 7); renderPlanning(); };
  $('pToday').onclick = () => { S._ps = null; renderPlanning(); };
  el.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { const [room, d] = b.dataset.slot.split('|'); const rm = S.rooms.find(x => x.id === room); openResaForm({ room_id: room, check_in: d, check_out: addDays(d, 1), nightly_rate: rm ? rm.base_rate : '' }, renderPlanning); });
  bindResaActions(el, renderPlanning);
}

/* ---------- Clients ---------- */
async function renderClients(){
  const el = $('v-clients'); el.innerHTML = '<p class="muted">Chargement…</p>';
  const { data } = await sb.from('guests').select('*').eq('organization_id', S.org).order('full_name').limit(1000);
  const q = (S._cq || '').toLowerCase();
  const rows = (data || []).filter(g => !q || (g.full_name + ' ' + (g.phone || '') + ' ' + (g.email || '')).toLowerCase().includes(q));
  el.innerHTML = head('Clients', `<button class="primary" id="cNew">Nouveau client</button>`) + `
    <div class="card" style="margin-bottom:14px"><label for="cQ">Recherche</label><input id="cQ" value="${esc(S._cq || '')}" placeholder="Nom, téléphone, e-mail"></div>
    <div class="card">${rows.length === 0 ? '<p class="muted">Aucun client.</p>' : `<div class="tablewrap"><table class="table"><thead><tr><th>Nom</th><th>Téléphone</th><th>Pièce d'identité</th><th>Nationalité</th><th></th></tr></thead><tbody>
      ${rows.map(g => `<tr><td><strong>${esc(g.full_name)}</strong><div class="muted" style="font-size:12px">${esc(g.email || '')}</div></td><td>${esc(g.phone || '—')}</td><td>${g.id_type ? esc(g.id_type.toUpperCase()) + ' ' + esc(g.id_number || '') : '—'}</td><td>${esc(g.nationality || '—')}</td><td><button class="small ghost" data-guest="${g.id}">Fiche</button></td></tr>`).join('')}
    </tbody></table></div>`}</div>`;
  $('cQ').onchange = (e) => { S._cq = e.target.value; renderClients(); };
  $('cNew').onclick = () => guestForm({});
  el.querySelectorAll('[data-guest]').forEach(b => b.onclick = () => guestForm(rows.find(g => g.id === b.dataset.guest)));
}
async function guestForm(g){
  let hist = '';
  if (g.id) {
    const { data } = await sb.from('reservation_balances').select('id,room_number,check_in,check_out,total_amount,paid,status').eq('guest_id', g.id).order('check_in', { ascending: false });
    hist = `<h3 style="font-size:18px;margin:16px 0 6px">Historique des séjours</h3>${(data || []).length ? data.map(r => `<div class="row between" style="border-bottom:1px solid #F0ECE3;padding:6px 0;font-size:13px"><span>${dfr(r.check_in)} → ${dfr(r.check_out)} · Ch. ${esc(r.room_number)} · ${RSTATUS[r.status]}</span><span>${money(r.paid)} / ${money(r.total_amount)}</span></div>`).join('') : '<p class="muted">Aucun séjour.</p>'}`;
  }
  const ID = { cni:'CNI', passeport:'Passeport', permis:'Permis', carte_consulaire:'Carte consulaire', autre:'Autre' };
  modal(`<h2 style="font-size:24px;margin-bottom:12px">${g.id ? esc(g.full_name) : 'Nouveau client'}</h2><form id="gForm">
    <div class="field"><label for="gN">Nom complet</label><input id="gN" required minlength="2" value="${esc(g.full_name || '')}"></div>
    <div class="row"><div class="field" style="flex:1 1 140px"><label for="gP">Téléphone</label><input id="gP" value="${esc(g.phone || '')}"></div><div class="field" style="flex:1 1 180px"><label for="gE">E-mail</label><input id="gE" type="email" value="${esc(g.email || '')}"></div></div>
    <div class="row"><div class="field" style="flex:1 1 130px"><label for="gT">Pièce</label><select id="gT"><option value="">—</option>${opt(ID, g.id_type)}</select></div><div class="field" style="flex:1 1 150px"><label for="gI">N° de pièce</label><input id="gI" value="${esc(g.id_number || '')}"></div><div class="field" style="flex:1 1 130px"><label for="gNat">Nationalité</label><input id="gNat" value="${esc(g.nationality || '')}"></div></div>
    <div class="row"><button class="primary">Enregistrer</button><button type="button" class="ghost" data-close>Fermer</button></div></form>${hist}`);
  $('gForm').onsubmit = async (e) => { e.preventDefault();
    const row = { full_name: $('gN').value.trim(), phone: $('gP').value.trim() || null, email: $('gE').value.trim() || null, id_type: $('gT').value || null, id_number: $('gI').value.trim() || null, nationality: $('gNat').value.trim() || null };
    const { error } = g.id ? await sb.from('guests').update(row).eq('id', g.id) : await sb.from('guests').insert({ ...row, organization_id: S.org });
    if (error) return toast(errMsg(error), true); closeModal(); toast('Client enregistré.'); renderClients(); };
}

/* ---------- Caisse ---------- */
async function renderCaisse(){
  const el = $('v-caisse'); el.innerHTML = '<p class="muted">Chargement…</p>';
  if (!can(['owner','admin','manager','receptionist','accountant'])) { el.innerHTML = head('Caisse') + '<p class="muted">Accès réservé.</p>'; return; }
  await loadEst();
  const { data: sess } = await sb.from('cash_sessions').select('*').eq('establishment_id', S.est).eq('status', 'open').maybeSingle();
  const since = sess ? sess.opened_at : today() + 'T00:00:00';
  const { data: mv } = await sb.from('cash_movements').select('*').eq('establishment_id', S.est).gte('created_at', since).order('created_at', { ascending: false });
  const cash = (mv || []).filter(m => m.method === 'cash' && (!sess || m.session_id === sess.id));
  const sum = (arr, kinds) => arr.filter(m => kinds.includes(m.kind)).reduce((a, m) => a + Number(m.amount), 0);
  const expected = (sess ? Number(sess.opening_balance) : 0) + sum(cash, ['payment','income']) - sum(cash, ['expense','refund']);
  const byMethod = Object.keys(PMETHOD).map(k => [k, sum((mv || []).filter(m => m.method === k), ['payment','income']) - sum((mv || []).filter(m => m.method === k), ['expense','refund'])]).filter(x => x[1] !== 0);
  el.innerHTML = head('Caisse', sess ? `<button class="ghost" id="kMove">Entrée / dépense</button><button class="primary" id="kClose">Clôturer la caisse</button>` : '') + readOnlyNote() + (sess ? `
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card kpi"><div class="l">Ouverte le</div><div class="v" style="font-size:20px">${new Date(sess.opened_at).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' })}</div></div>
      <div class="card kpi"><div class="l">Fond de caisse</div><div class="v">${money(sess.opening_balance)}</div></div>
      <div class="card kpi"><div class="l">Espèces attendues</div><div class="v">${money(expected)}</div></div>
      <div class="card kpi"><div class="l">Dépenses</div><div class="v">${money(sum(mv || [], ['expense']))}</div></div>
    </div>` : `<div class="card" style="margin-bottom:16px"><h3 style="font-size:20px;margin-bottom:8px">La caisse est fermée</h3><p class="muted" style="margin:0 0 12px">Ouvrez la caisse avec le fond initial pour enregistrer des encaissements en espèces.</p>
      <form id="kOpen" class="row" style="align-items:flex-end"><div style="flex:0 1 200px"><label for="kFund">Fond de caisse (F)</label><input id="kFund" type="number" min="0" value="0"></div><button class="primary">Ouvrir la caisse</button></form></div>`) + `
    ${byMethod.length ? `<div class="card" style="margin-bottom:16px"><h3 style="font-size:18px;margin-bottom:8px">Solde par moyen de paiement ${sess ? '(session en cours)' : '(aujourd’hui)'}</h3><div class="row">${byMethod.map(([k, v]) => `<span class="pill st-trial">${PMETHOD[k]} : ${money(v)}</span>`).join('')}</div></div>` : ''}
    <div class="card"><h3 style="font-size:18px;margin-bottom:8px">Journal</h3>${(mv || []).length === 0 ? '<p class="muted">Aucun mouvement.</p>' : `<div class="tablewrap"><table class="table"><thead><tr><th>Heure</th><th>Libellé</th><th>Moyen</th><th>Réf.</th><th class="r">Montant</th></tr></thead><tbody>
      ${mv.map(m => `<tr><td>${new Date(m.created_at).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}</td><td>${esc(m.label)}</td><td>${PMETHOD[m.method]}</td><td>${esc(m.reference || '')}</td><td style="text-align:right;font-weight:700;color:${['expense','refund'].includes(m.kind) ? 'var(--red)' : 'var(--green)'}">${['expense','refund'].includes(m.kind) ? '−' : '+'}${money(m.amount)}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
  const o = $('kOpen'); if (o) o.onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from('cash_sessions').insert({ establishment_id: S.est, opening_balance: +$('kFund').value || 0 }); if (error) return toast(errMsg(error), true); toast('Caisse ouverte.'); renderCaisse(); };
  const mvb = $('kMove'); if (mvb) mvb.onclick = () => {
    modal(`<h2 style="font-size:24px;margin-bottom:12px">Mouvement de caisse</h2><form id="mF">
      <div class="row"><div class="field" style="flex:1 1 140px"><label for="mK">Type</label><select id="mK"><option value="expense">Dépense / sortie</option><option value="income">Entrée diverse</option></select></div><div class="field" style="flex:1 1 140px"><label for="mM">Moyen</label><select id="mM">${opt(PMETHOD, 'cash')}</select></div></div>
      <div class="row"><div class="field" style="flex:1 1 120px"><label for="mA">Montant (F)</label><input id="mA" type="number" min="1" required></div><div class="field" style="flex:2 1 200px"><label for="mL">Libellé</label><input id="mL" required placeholder="Ex. Achat produits d'entretien"></div></div>
      <div class="row"><button class="primary">Enregistrer</button><button type="button" class="ghost" data-close>Annuler</button></div></form>`);
    $('mF').onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from('cash_movements').insert({ establishment_id: S.est, kind: $('mK').value, method: $('mM').value, amount: +$('mA').value, label: $('mL').value.trim() });
      if (error) return toast(errMsg(error), true); closeModal(); toast('Mouvement enregistré.'); renderCaisse(); };
  };
  const cl = $('kClose'); if (cl) cl.onclick = () => {
    modal(`<h2 style="font-size:24px;margin-bottom:8px">Clôture de caisse</h2><p>Espèces attendues : <strong>${money(expected)}</strong></p><form id="clF">
      <div class="field"><label for="clC">Espèces comptées (F)</label><input id="clC" type="number" min="0" required value="${expected}"></div><p id="clD" class="muted"></p>
      <div class="row"><button class="primary">Clôturer</button><button type="button" class="ghost" data-close>Annuler</button></div></form>`);
    const diff = () => { const d = (+$('clC').value || 0) - expected; $('clD').textContent = d === 0 ? 'Aucun écart.' : `Écart : ${d > 0 ? '+' : ''}${money(d)}`; };
    $('clC').oninput = diff; diff();
    $('clF').onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from('cash_sessions').update({ status: 'closed', counted_balance: +$('clC').value || 0 }).eq('id', sess.id);
      if (error) return toast(errMsg(error), true); closeModal(); toast('Caisse clôturée.'); renderCaisse(); };
  };
}

/* ---------- Factures clients ---------- */
async function renderFactures(){
  const el = $('v-factures'); el.innerHTML = '<p class="muted">Chargement…</p>';
  await loadEst();
  const { data } = await sb.from('guest_invoices').select('*').eq('organization_id', S.org).order('issued_at', { ascending: false }).limit(300);
  S._ginv = data || [];
  el.innerHTML = head('Factures') + `<div class="card">${S._ginv.length === 0 ? '<p class="muted">Aucune facture. Émettez-en une depuis une réservation (bouton « Facture »).</p>' : `<div class="tablewrap"><table class="table"><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Total</th><th>Réglé</th><th>Reste</th><th></th></tr></thead><tbody>
    ${S._ginv.map(i => `<tr><td><strong>${esc(i.number)}</strong></td><td>${new Date(i.issued_at).toLocaleDateString('fr-FR')}</td><td>${esc(i.guest_name)}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${i.balance > 0 ? `<strong style="color:var(--amber)">${money(i.balance)}</strong>` : '0 F'}</td><td><button class="small ghost" data-pinv="${i.id}">Imprimer / PDF</button></td></tr>`).join('')}
  </tbody></table></div>`}</div>`;
  el.querySelectorAll('[data-pinv]').forEach(b => b.onclick = () => printGuestInvoice(S._ginv.find(i => i.id === b.dataset.pinv)));
}

sb.auth.onAuthStateChange((evt) => { if (['SIGNED_IN','SIGNED_OUT'].includes(evt)) { S.view = 'dashboard'; boot(); } });
boot();
</script>
